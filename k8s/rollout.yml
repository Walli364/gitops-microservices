apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: gitops-app-rollout
  namespace: default
spec:
  replicas: 4
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: gitops-app
  template:
    metadata:
      labels:
        app: gitops-app
    spec:
      containers:
      - name: gitops-app
        image: walli364/gitops-app:98e7483db0b3e359f78e48e2e15ca40eb1abf5c6
        ports:
        - containerPort: 5000
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
  strategy:
    canary:
      steps:
      - setWeight: 25
      - pause: { duration: 30s }
      - setWeight: 50
      - pause: { duration: 30s }