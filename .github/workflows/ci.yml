name: Build, Scan and Push

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Image Build (Local tag for scanning)
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/gitops-app:${{ github.sha }} ./app

      # 2. Trivy Security Scan
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/gitops-app:${{ github.sha }}'
          format: 'table'
          exit-code: '0' # '0' rakha hai ta k scan report dikhaye pr pipeline block na kare
          severity: 'CRITICAL,HIGH'

      # 3. Push to Docker Hub
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gitops-app:${{ github.sha }}

      - name: Update Image Tag in Rollout Manifest
        run: |
          IMAGE_TAG=${{ github.sha }}
          sed -i "s|image: walli364/gitops-app:.*|image: walli364/gitops-app:${IMAGE_TAG}|g" k8s/rollout.yml
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/rollout.yml
          git commit -m "chore(gitops): auto-update image to ${IMAGE_TAG} [skip ci]" || echo "No changes to commit"
          git push origin main